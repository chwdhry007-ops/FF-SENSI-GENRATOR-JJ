<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe DPI & Touch Latency Engine | Headshot DPI</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card: #10141f;
      --border: #1e2638;
      --red: #ff2252;
      --cyan: #00f0ff;
      --yellow: #ffb703;
      --green: #00e676;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px 10px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    /* Top Nav */
    .top-bar { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 12px; }
    .nav-links a:hover { color: var(--cyan); }
    .badge { background: rgba(0, 240, 255, 0.15); border: 1px solid var(--cyan); color: var(--cyan); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
    .header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
    .header h1 span { color: var(--cyan); }
    .header p { color: var(--muted); font-size: 0.85rem; margin-top: 5px; }

    /* Form Card */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }

    .input-group { margin-bottom: 14px; }
    label { display: block; font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; }

    input[type="text"], select {
      width: 100%; padding: 12px 14px; background: #07090e; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.2s border;
    }
    input[type="text"]:focus, select:focus { border-color: var(--cyan); }

    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    .btn-calc {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--cyan), #0077b6); border: none; border-radius: 8px; color: #07090e; font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 25px rgba(0, 240, 255, 0.4);
    }
    .btn-calc:active { transform: scale(0.98); }

    /* Results */
    .results { display: none; margin-top: 25px; border-top: 1px solid var(--border); padding-top: 20px; }
    .res-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #fff; text-transform: uppercase; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

    .dpi-display {
      background: #07090e; border: 2px solid var(--cyan); border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 15px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    }
    .dpi-display .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .dpi-display .value { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--cyan); margin: 6px 0; }
    .dpi-display .sub { font-size: 0.75rem; color: var(--green); font-weight: 600; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .grid-box { background: #07090e; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .grid-box span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .grid-box .num { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; margin-top: 4px; }

    .warning-box {
      background: rgba(255, 34, 82, 0.08); border-left: 3px solid var(--red); padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.8rem; line-height: 1.45;
    }
    .warning-box strong { color: var(--red); }
